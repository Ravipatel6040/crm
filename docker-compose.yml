version: '3.8'

services:
  backend:
    build: ./crm_backend
    ports:
      - "5000:5000"
    env_file:
      - ./crm_backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./crm_frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
